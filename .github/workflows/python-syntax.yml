name: Python syntax check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "grox/**"]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Grox
        run: python -m py_compile main.py
